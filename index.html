<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Ronda Obstétrica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <span class="marca">Ronda Obstétrica</span>
    <span id="data-hoje" class="data-hoje"></span>
    <button type="button" id="botao-tema" class="sec tema" data-act="tema">Tema</button>
  </header>

  <main id="tela" class="tela" tabindex="-1"></main>

  <nav id="abas" class="abas" aria-label="Abas"></nav>

  <div id="folha" class="folha" hidden>
    <div class="folha-fundo" data-act="fechar-folha"></div>
    <div id="folha-corpo" class="folha-corpo" role="dialog" aria-modal="true" aria-label="Formulário"></div>
  </div>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <div id="impressao" aria-hidden="true"></div>

  <noscript>Este app precisa de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
