<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Ronda Obstétrica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fdf5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1217" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f08fb3"/><stop offset="1" stop-color="#c2527a"/></linearGradient></defs>
      <rect width="512" height="512" rx="124" fill="url(#lg)"/>
      <circle cx="256" cy="256" r="152" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-dasharray="800 155" transform="rotate(-50 256 256)"/>
      <circle cx="256" cy="104" r="19" fill="#fff"/>
      <path fill="#fff" d="M256 326C203 286 184 256 184 230C184 205 203 190 224 190C239 190 250 198 256 210C262 198 273 190 288 190C309 190 328 205 328 230C328 256 309 286 256 326Z"/>
    </svg>
    <span class="marca">Ronda</span>
    <span id="data-hoje" class="data-hoje"></span>
    <button type="button" class="calc-btn" data-act="calc-abrir" aria-label="Calculadoras" title="Calculadoras">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><rect x="5" y="3" width="14" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="8" y="6" width="8" height="3.5" rx="1" fill="currentColor"/><circle cx="9" cy="13" r="1.2" fill="currentColor"/><circle cx="12" cy="13" r="1.2" fill="currentColor"/><circle cx="15" cy="13" r="1.2" fill="currentColor"/><circle cx="9" cy="17" r="1.2" fill="currentColor"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/><circle cx="15" cy="17" r="1.2" fill="currentColor"/></svg>
    </button>
    <button type="button" id="botao-tema" class="tema" data-act="tema" aria-label="Tema">◐</button>
  </header>

  <main id="tela" class="tela" tabindex="-1"></main>

  <nav id="abas" class="abas" aria-label="Abas"></nav>

  <div id="folha" class="folha" hidden>
    <div class="folha-fundo" data-act="fechar-folha"></div>
    <div id="folha-corpo" class="folha-corpo" role="dialog" aria-modal="true" aria-label="Formulário"></div>
  </div>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <button type="button" id="atualizar" class="atualizar" hidden>Nova versão disponível — atualizar</button>

  <div id="impressao" aria-hidden="true"></div>

  <noscript>Este app precisa de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
